<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>
      บริการรับฝากเก็บสินค้า (วัตถุดิบแช่แข็ง) - บริษัท เอ็น เอส โคลด์ สโตเรจ
      จำกัด
    </title>
    <link rel="icon" type="image/png" href="./images/Logo.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      .step-card {
        background: #ffffff;
        border-radius: 1.5rem;
        border: 1px solid #e2e8f0;
        box-shadow: 0 10px 25px -5px rgba(0, 34, 85, 0.06);
        position: relative;
        margin-top: 1.5rem;
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      .step-card-badge {
        background: linear-gradient(
          90deg,
          #002255 0%,
          #0044cc 50%,
          #002255 100%
        );
        color: white;
        padding: 6px 28px;
        border-radius: 9999px;
        position: absolute;
        top: -18px;
        left: 50%;
        transform: translateX(-50%);
        font-weight: 500;
        z-index: 10;
        border: 2px solid #ffffff;
        white-space: nowrap;
      }
    </style>
  </head>
  <body
    class="text-gray-800 antialiased flex flex-col min-h-screen bg-[#f4f7fb]"
  >
    <header class="bg-white pt-3 shadow-sm sticky top-0 text-center py-3">
      <a href="index.html" class="text-xl font-bold text-[#003380]"
        >บริษัท เอ็น เอส โคลด์ สโตเรจ จำกัด (หน้าแรก)</a
      >
    </header>
    <main class="container mx-auto px-4 max-w-5xl py-8 flex-grow">
      <h1 class="text-2xl md:text-4xl font-bold text-blue-800 text-center mb-8">
        บริการ "รับฝากเก็บสินค้า" (วัตถุดิบแช่แข็ง)
      </h1>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
        <div class="step-card p-6">
          <div class="step-card-badge">ขั้นตอนที่ 1</div>
          <div class="h-48 mb-4 flex justify-center">
            <img
              src="./images/NS_3.jpg"
              alt="Step 1"
              class="max-h-full object-contain rounded-lg"
            />
          </div>
          <p class="text-slate-700 text-center">
            ลูกค้าที่ต้องการฝากสินค้าต้องแจ้งกับทางฝ่ายการตลาด บริษัท NS Cold
            Storage ล่วงหน้าอย่างน้อย 1 วัน
          </p>
        </div>
      </div>
    </main>
    <footer class="bg-[#002255] text-white py-6 text-center">
      <p>Copyright © 2011-2026 NS COLD STORAGE CO.,LTD.</p>
    </footer>
  </body>
</html>
