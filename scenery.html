<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ทัศนียภาพ - บริษัท เอ็น เอส โคลด์ สโตเรจ จำกัด</title>
    <link rel="icon" type="image/png" href="./images/Logo.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body
    class="text-gray-800 antialiased flex flex-col min-h-screen bg-[#f4f7fb]"
  >
    <header class="bg-white pt-3 shadow-sm sticky top-0 text-center py-3">
      <a href="index.html" class="text-xl font-bold text-[#003380]"

      >
    </header>

    <main class="max-w-5xl mx-auto px-4 py-8 flex-grow">
      <h1 class="text-2xl md:text-3xl font-bold text-blue-700 mb-6 text-center">
        ทัศนียภาพภายในบริษัท
      </h1>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6 my-6">
        <div class="rounded-2xl overflow-hidden shadow-md bg-white p-2">
          <img
            src="./images/sl1.jpg"
            alt="ภาพ 1"
            class="w-full h-64 object-cover rounded-xl"
          />
        </div>
        <div class="rounded-2xl overflow-hidden shadow-md bg-white p-2">
          <img
            src="./images/sl2.jpg"
            alt="ภาพ 2"
            class="w-full h-64 object-cover rounded-xl"
          />
        </div>
        <div class="rounded-2xl overflow-hidden shadow-md bg-white p-2">
          <img
            src="./images/sl3.jpg"
            alt="ภาพ 3"
            class="w-full h-64 object-cover rounded-xl"
          />
        </div>
        <div class="rounded-2xl overflow-hidden shadow-md bg-white p-2">
          <img
            src="./images/sl4.jpg"
            alt="ภาพ 4"
            class="w-full h-64 object-cover rounded-xl"
          />
        </div>
      </div>
    </main>

    <footer class="bg-[#002255] text-white py-6 text-center">
      <p>Copyright © 2011-2026 NS COLD STORAGE CO.,LTD.</p>
    </footer>
