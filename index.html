<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>บริษัท เอ็น เอส โคลด์ สโตเรจ จำกัด</title>
    <link rel="icon" type="image/png" href="./images/Logo.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      body {
        font-family: "Kanit", sans-serif;
        background-color: #f4f7fb;
      }
      .service-card-shape {
        border-radius: 24px;
        background-color: #ffffff;
        border: 1px solid #e2e8f0;
        box-shadow: 0 10px 30px -10px rgba(0, 34, 85, 0.06);
        transition: all 0.35s ease;
      }
      .service-card-shape:hover {
        transform: translateY(-8px);
        border-color: #38bdf8;
      }
    </style>
  </head>
  <body class="text-gray-800 antialiased flex flex-col min-h-screen">
    <!-- Header -->
    <header class="bg-white pt-3 md:pt-4 shadow-sm z-50 sticky top-0">
      <div class="container mx-auto px-4 max-w-6xl md:pb-3">
        <div class="flex justify-between items-center min-h-[90px]">
          <a href="index.html" class="flex items-center space-x-4">
            <img
              src="./images/Logo_NS.png"
              alt="Logo"
              class="h-16 object-contain"
            />
          </a>
          <h1 class="text-xl md:text-[26px] font-semibold text-[#003380]">
            บริษัท เอ็น เอส โคลด์ สโตเรจ จำกัด
          </h1>
          <a
            href="contact-us.html"
            class="bg-red-600 text-white py-2 px-4 rounded-2xl"
            >ติดต่อด่วน</a
          >
        </div>
      </div>
      <nav class="bg-[#001f4d] text-white py-2.5">
        <div
          class="container mx-auto px-4 max-w-6xl flex justify-center space-x-6 text-sm"
        >
          <a href="index.html" class="hover:text-sky-300">หน้าแรก</a>
          <a href="about-us.html" class="hover:text-sky-300">เกี่ยวกับเรา</a>
          <a href="careers.html" class="hover:text-sky-300">ร่วมงานกับเรา</a>
          <a href="contact-us.html" class="hover:text-sky-300">ติดต่อเรา</a>
        </div>
      </nav>
    </header>

    <!-- Hero Video (YouTube Embed) -->
    <div class="bg-[#001a40] py-8 text-center">
      <div class="container mx-auto px-4 max-w-4xl">
        <div
          class="relative w-full overflow-hidden rounded-2xl shadow-lg"
          style="padding-top: 56.25%"
        >
          <iframe
            class="absolute top-0 left-0 w-full h-full border-0"
            src="https://www.youtube.com/embed/0CyG4hNOw7A"
            title="NS Cold Storage Video"
            allow="
              accelerometer;
              autoplay;
              clipboard-write;
              encrypted-media;
              gyroscope;
              picture-in-picture;
            "
            allowfullscreen
          ></iframe>
        </div>
      </div>
    </div>

    <!-- Core Services -->
    <section class="container mx-auto px-4 max-w-5xl my-12 flex-grow">
      <h2 class="text-3xl font-bold text-[#003380] text-center mb-8">
        บริการของเรา
      </h2>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
        <a href="service-freeze.html" class="service-card-shape p-4 block">
          <img
            src="./images/ฟรีส (Freeze).jpeg"
            alt="บริการฟรีส"
            class="w-full h-48 object-contain mb-4"
          />
          <h3 class="font-semibold text-lg text-center text-slate-800">
            บริการฟรีส (Freeze)
          </h3>
        </a>
        <a
          href="service-finished-goods.html"
          class="service-card-shape p-4 block"
        >
          <img
            src="./images/รับฝากเก็บสินค้า.jpeg"
            alt="รับฝากเก็บ"
            class="w-full h-48 object-contain mb-4"
          />
          <h3 class="font-semibold text-lg text-center text-slate-800">
            บริการรับฝากเก็บสินค้า
          </h3>
        </a>
      </div>
    </section>

    <!-- Footer -->
    <footer class="bg-[#002255] text-white pt-12 pb-6">
      <div class="container mx-auto px-4 max-w-6xl text-center">
        <p>
          Copyright © 2011-2026 NS COLD STORAGE CO.,LTD. All Rights Reserved.
        </p>
      </div>
    </footer>
  </body>
</html>
